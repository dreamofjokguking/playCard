name: Conflict Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-workzones:
    name: Check workzone overlap
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect overlaps and comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            const workzonePath = '.workzones.yml';
            if (!fs.existsSync(workzonePath)) {
              core.info('.workzones.yml not found; skipping.');
              return;
            }

            const raw = fs.readFileSync(workzonePath, 'utf8');
            const lines = raw.split(/\r?\n/);
            const zones = [];
            let current = null;

            for (const line of lines) {
              const trimmed = line.trim();
              if (trimmed.startsWith('- path:')) {
                if (current) zones.push(current);
                current = { path: trimmed.split(':').slice(1).join(':').trim().replace(/^['"]|['"]$/g, '') };
              } else if (current && trimmed.startsWith('owner:')) {
                current.owner = trimmed.split(':').slice(1).join(':').trim().replace(/^['"]|['"]$/g, '');
              } else if (current && trimmed.startsWith('status:')) {
                current.status = trimmed.split(':').slice(1).join(':').trim().replace(/^['"]|['"]$/g, '');
              } else if (current && trimmed.startsWith('reason:')) {
                current.reason = trimmed.split(':').slice(1).join(':').trim().replace(/^['"]|['"]$/g, '');
              }
            }
            if (current) zones.push(current);

            const activeZones = zones.filter((z) => ['active', 'locked'].includes((z.status || '').toLowerCase()));
            if (activeZones.length === 0) {
              core.info('No active/locked zones; skipping.');
              return;
            }

            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            const changed = execSync(`git diff --name-only ${base}...${head}`, { encoding: 'utf8' })
              .split(/\r?\n/)
              .map((v) => v.trim())
              .filter(Boolean);

            const conflicts = [];
            for (const file of changed) {
              for (const zone of activeZones) {
                const p = zone.path || '';
                if (p && (file.startsWith(p) || file === p)) {
                  conflicts.push({ file, zone });
                }
              }
            }

            if (conflicts.length === 0) {
              core.info('No workzone overlap.');
              return;
            }

            const marker = '<!-- workzone-conflict-guard -->';
            const rows = conflicts
              .map((c) => `| \`${c.file}\` | ${c.zone.owner || '-'} | ${c.zone.reason || '-'} |`)
              .join('\n');

            const body = [
              marker,
              '## ⚠️ Workzone Overlap Detected',
              '',
              '이 PR의 변경 파일이 현재 `.workzones.yml`의 활성 구역과 겹칩니다.',
              '',
              '| Changed file | Owner | Reason |',
              '| --- | --- | --- |',
              rows,
              '',
              '진행 전 작업자와 충돌 여부를 먼저 조율해주세요.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
