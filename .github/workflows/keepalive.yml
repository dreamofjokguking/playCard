name: Render Keep-Alive

on:
  schedule:
    - cron: '*/13 21-23 * * *'
    - cron: '*/13 0-14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/ping
        env:
          BASE_URL: ${{ vars.RENDER_APP_URL || 'https://sideprojectmate.onrender.com' }}
        run: |
          set -euo pipefail
          echo "Pinging $BASE_URL/api/ping"
          status=$(curl -fsSL -o /tmp/ping.json -w "%{http_code}" \
            --max-time 60 --retry 3 --retry-delay 10 --retry-connrefused \
            "$BASE_URL/api/ping" || echo "000")
          echo "HTTP $status"
          cat /tmp/ping.json || true
          test "$status" = "200"
