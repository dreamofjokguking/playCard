name: Preview Deploy Hint

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'work-logs/**'
      - 'docs/**'
      - '**/*.md'
      - '.workzones.yml'
      - '.claude/**'

jobs:
  preview-hint:
    name: Comment preview URL
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Upsert preview comment
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ vars.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- preview-deploy-comment -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const previewUrl = process.env.PREVIEW_URL || 'PREVIEW_URL repo variable not set';

            const body = [
              marker,
              '## Preview Check',
              '',
              `기준 커밋: \`${sha}\``,
              '',
              `미리보기 URL: ${previewUrl}`,
              '',
              '> 운영 환경에 맞는 URL은 Repository Variables의 `PREVIEW_URL`로 관리하세요.'
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
