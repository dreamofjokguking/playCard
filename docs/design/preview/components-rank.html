<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:20px;background:var(--pc-bg);font-family:var(--pc-font-sans);}
.list{background:var(--pc-surface);border:1px solid var(--pc-border);border-radius:14px;overflow:hidden;}
.r{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--pc-border);}
.r:last-child{border:none;}
.rank{font-family:var(--pc-font-display);font-weight:900;font-style:italic;font-size:22px;width:36px;font-feature-settings:"tnum";}
.r1 .rank{color:var(--pc-accent-deep);}
.r2 .rank{color:#A8A29E;}
.r3 .rank{color:#B45309;}
.av{width:36px;height:36px;border-radius:50%;background:var(--pc-bg-deep);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.who{flex:1;}
.nm{font-weight:700;font-size:14px;}
.tt{font-size:11px;color:var(--pc-ink-tertiary);font-weight:600;}
.score{font-family:var(--pc-font-display);font-style:italic;font-weight:900;font-size:18px;font-feature-settings:"tnum";color:var(--pc-ink);}
.delta{font-weight:800;font-size:12px;width:50px;text-align:right;font-family:var(--pc-font-mono);}
.up{color:var(--pc-trend-up);}
.dn{color:var(--pc-trend-down);}
.fl{color:var(--pc-trend-flat);}
</style></head>
<body>
  <div class="list">
    <div class="r r1"><span class="rank">1</span><div class="av" style="background:var(--pc-accent-tint);">홍</div><div class="who"><div class="nm">홍길동</div><div class="tt">네트 위의 암살자</div></div><span class="score">9.2</span><span class="delta up">▲ 2</span></div>
    <div class="r r2"><span class="rank">2</span><div class="av">김</div><div class="who"><div class="nm">김민지</div><div class="tt">코트의 지휘자</div></div><span class="score">8.7</span><span class="delta dn">▼ 1</span></div>
    <div class="r r3"><span class="rank">3</span><div class="av">이</div><div class="who"><div class="nm">이재훈</div><div class="tt">서브 머신</div></div><span class="score">8.4</span><span class="delta fl">－</span></div>
    <div class="r"><span class="rank" style="color:var(--pc-ink-tertiary);">4</span><div class="av">박</div><div class="who"><div class="nm">박철수</div><div class="tt">묵묵한 수비가</div></div><span class="score">7.9</span><span class="delta up">▲ 5</span></div>
  </div>
</body></html>
