<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--pc-surface);}
.row{display:flex;align-items:baseline;gap:16px;padding:8px 0;border-bottom:1px dashed var(--pc-border);}
.row:last-child{border:none;}
.label{font-size:11px;color:var(--pc-ink-tertiary);font-weight:600;letter-spacing:.06em;text-transform:uppercase;width:100px;flex-shrink:0;font-family:var(--pc-font-mono);}
</style></head>
<body>
  <div class="row"><span class="label">Display</span><span class="pc-display">PlayCard</span></div>
  <div class="row"><span class="label">H1 32/800</span><span class="pc-h1">오늘의 경기 평가</span></div>
  <div class="row"><span class="label">H2 24/700</span><span class="pc-h2">이번 시즌 MVP는?</span></div>
  <div class="row"><span class="label">H3 20/700</span><span class="pc-h3">최근 5경기 기록</span></div>
  <div class="row"><span class="label">H4 17/600</span><span class="pc-h4">네트 위의 암살자</span></div>
</body></html>
