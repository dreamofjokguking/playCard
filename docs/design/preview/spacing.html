<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--pc-surface);font-family:var(--pc-font-sans);}
.row{display:flex;align-items:center;gap:14px;padding:6px 0;}
.tag{font-family:var(--pc-font-mono);font-size:11px;color:var(--pc-ink-tertiary);width:80px;}
.bar{height:14px;background:var(--pc-primary);border-radius:4px;}
.val{font-size:12px;color:var(--pc-ink);font-weight:600;font-family:var(--pc-font-mono);}
</style></head>
<body>
  <div class="row"><span class="tag">space-1</span><span class="bar" style="width:2px;"></span><span class="val">2px</span></div>
  <div class="row"><span class="tag">space-2</span><span class="bar" style="width:4px;"></span><span class="val">4px</span></div>
  <div class="row"><span class="tag">space-3</span><span class="bar" style="width:8px;"></span><span class="val">8px</span></div>
  <div class="row"><span class="tag">space-4</span><span class="bar" style="width:12px;"></span><span class="val">12px</span></div>
  <div class="row"><span class="tag">space-5</span><span class="bar" style="width:16px;"></span><span class="val">16px</span></div>
  <div class="row"><span class="tag">space-6</span><span class="bar" style="width:24px;"></span><span class="val">24px</span></div>
  <div class="row"><span class="tag">space-7</span><span class="bar" style="width:32px;"></span><span class="val">32px</span></div>
  <div class="row"><span class="tag">space-8</span><span class="bar" style="width:48px;"></span><span class="val">48px</span></div>
  <div class="row"><span class="tag">space-9</span><span class="bar" style="width:64px;"></span><span class="val">64px</span></div>
</body></html>
