<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px;background:var(--pc-surface);display:flex;gap:32px;align-items:center;flex-wrap:wrap;}
.box{display:flex;flex-direction:column;align-items:center;gap:6px;}
.cap{font-size:10px;color:var(--pc-ink-tertiary);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-family:var(--pc-font-mono);}
</style></head>
<body>
  <div class="box"><span class="pc-score" style="font-size:72px;color:var(--pc-primary);">8.4</span><span class="cap">전체 평균</span></div>
  <div class="box"><span class="pc-stat-num" style="font-size:48px;color:var(--pc-ink);">12<span style="font-size:24px;color:var(--pc-ink-tertiary);">경기</span></span><span class="cap">시즌</span></div>
  <div class="box"><span class="pc-score" style="font-size:48px;color:var(--pc-accent-deep);">3<span style="font-size:24px;">×</span></span><span class="cap">MVP</span></div>
  <div class="box"><span class="pc-stat-num" style="font-size:36px;color:var(--pc-ink);">LV.<span style="color:var(--pc-primary);">12</span></span><span class="cap">레벨</span></div>
</body></html>
