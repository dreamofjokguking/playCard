<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--pc-surface);font-family:var(--pc-font-sans);}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .pill{border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .dot{width:10px;height:10px;border-radius:50%;}
  .row2{display:flex;gap:16px;margin-top:16px;align-items:center;}
  .trend{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;font-family:var(--pc-font-display);font-style:italic;}
  .arrow{font-size:14px;}
</style></head>
<body>
  <div class="grid">
    <div class="pill" style="background:var(--pc-success-tint);color:var(--pc-success);"><span class="dot" style="background:var(--pc-success);"></span>Success · 성공</div>
    <div class="pill" style="background:var(--pc-warning-tint);color:var(--pc-accent-deep);"><span class="dot" style="background:var(--pc-warning);"></span>Warning · 주의</div>
    <div class="pill" style="background:var(--pc-danger-tint);color:var(--pc-danger);"><span class="dot" style="background:var(--pc-danger);"></span>Danger · 위험</div>
    <div class="pill" style="background:var(--pc-info-tint);color:var(--pc-info);"><span class="dot" style="background:var(--pc-info);"></span>Info · 안내</div>
  </div>
  <div class="row2">
    <span style="font-size:12px;color:var(--pc-ink-tertiary);font-weight:600;letter-spacing:.04em;text-transform:uppercase;">순위 변동</span>
    <span class="trend" style="color:var(--pc-trend-up);"><span class="arrow">▲</span>+3</span>
    <span class="trend" style="color:var(--pc-trend-down);"><span class="arrow">▼</span>-2</span>
    <span class="trend" style="color:var(--pc-trend-flat);"><span class="arrow">－</span>0</span>
    <span style="font-size:11px;color:var(--pc-ink-tertiary);margin-left:auto;">한국식: 상승=빨강, 하락=파랑</span>
  </div>
  <div class="row2" style="margin-top:14px;">
    <span style="font-size:12px;color:var(--pc-ink-tertiary);font-weight:600;letter-spacing:.04em;text-transform:uppercase;">팀</span>
    <span class="pill" style="background:var(--pc-team-blue-tint);color:var(--pc-team-blue);"><span class="dot" style="background:var(--pc-team-blue);"></span>청팀</span>
    <span class="pill" style="background:var(--pc-team-red-tint);color:var(--pc-team-red);"><span class="dot" style="background:var(--pc-team-red);"></span>홍팀</span>
  </div>
</body></html>
