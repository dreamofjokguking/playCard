<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--pc-surface);font-family:var(--pc-font-sans);}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px;}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--pc-border);border-radius:10px;background:var(--pc-bg);}
.ic{width:24px;height:24px;color:var(--pc-ink);}
.lbl{font-size:10px;color:var(--pc-ink-secondary);font-family:var(--pc-font-mono);font-weight:600;}
.note{font-size:11px;color:var(--pc-ink-tertiary);margin-top:14px;}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1V9.5z"/></svg><span class="lbl">Home</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg><span class="lbl">Star</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5A2.5 2.5 0 0 1 2 6.5V5h4M18 9h1.5A2.5 2.5 0 0 0 22 6.5V5h-4M6 5h12v6a6 6 0 0 1-12 0zM9 17h6l1 4H8z"/></svg><span class="lbl">Trophy</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V10M12 21V3M19 21v-7"/></svg><span class="lbl">BarChart</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><circle cx="17" cy="9" r="3"/><path d="M3 21a6 6 0 0 1 12 0M14 21a5 5 0 0 1 7 0"/></svg><span class="lbl">Users</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4l3 16h14l3-16-6 4-4-7-4 7z"/></svg><span class="lbl">Crown</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.5 4 4 1.5-4 1.5L12 14l-1.5-4-4-1.5 4-1.5zM19 14l.8 2 2 .8-2 .8L19 19.5l-.8-2-2-.8 2-.8zM5 16l.6 1.5L7 18l-1.5.5L5 20l-.5-1.5L3 18l1.5-.5z"/></svg><span class="lbl">Sparkles</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,17 9,11 13,15 21,7"/><polyline points="14,7 21,7 21,14"/></svg><span class="lbl">TrendUp</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,7 9,13 13,9 21,17"/><polyline points="14,17 21,17 21,10"/></svg><span class="lbl">TrendDown</span></div>

    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V5l12-2v13"/></svg><span class="lbl">Music2</span></div>

    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span class="lbl">Plus</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="16" y1="3" x2="16" y2="7"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="3" y1="10" x2="21" y2="10"/></svg><span class="lbl">Calendar</span></div>
    <div class="cell"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span class="lbl">User</span></div>
  </div>
  <div class="note">Lucide Icons (stroke 1.75) · CDN: <code style="font-family:var(--pc-font-mono);background:var(--pc-bg-deep);padding:2px 6px;border-radius:4px;">lucide-react</code> 또는 unpkg.com/lucide-static</div>
</body></html>
