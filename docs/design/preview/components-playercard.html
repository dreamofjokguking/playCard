<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--pc-bg);font-family:var(--pc-font-sans);display:flex;gap:16px;}
.card{width:200px;border-radius:20px;padding:16px;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;gap:10px;box-shadow:var(--pc-shadow-md);}
.common{background:linear-gradient(160deg,#9CA3AF 0%,#4B5563 100%);}
.epic{background:linear-gradient(160deg,#C084FC 0%,#6D28D9 100%);}
.legend{background:linear-gradient(160deg,#FFD24A 0%,#FF6B35 60%,#C73E20 100%);box-shadow:var(--pc-shadow-glow-gold);}
.top{display:flex;justify-content:space-between;align-items:flex-start;}
.lvl{font-family:var(--pc-font-mono);font-weight:700;font-size:11px;background:rgba(0,0,0,.25);padding:3px 8px;border-radius:6px;}
.rarity{font-size:10px;font-weight:800;letter-spacing:.1em;background:rgba(255,255,255,.2);padding:3px 8px;border-radius:6px;}
.avatar{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;font-family:var(--pc-font-display);font-style:italic;align-self:center;}
.name{font-weight:800;font-size:18px;text-align:center;letter-spacing:-0.01em;}
.title{font-size:11px;text-align:center;opacity:.95;background:rgba(0,0,0,.2);padding:4px 8px;border-radius:6px;font-weight:600;}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;font-size:11px;font-family:var(--pc-font-mono);font-weight:700;}
.stat{display:flex;justify-content:space-between;}
.score{font-style:italic;font-size:13px;}
</style></head>
<body>
  <div class="card common">
    <div class="top"><span class="lvl">LV.04</span><span class="rarity">COMMON</span></div>
    <div class="avatar">박</div>
    <div class="name">박철수</div>
    <div class="title">묵묵한 수비가</div>
    <div class="stats"><div class="stat">공격<span class="score">5.2</span></div><div class="stat">수비<span class="score">7.1</span></div><div class="stat">토스<span class="score">5.8</span></div><div class="stat">서브<span class="score">6.0</span></div></div>
  </div>
  <div class="card epic">
    <div class="top"><span class="lvl">LV.12</span><span class="rarity">EPIC</span></div>
    <div class="avatar">김</div>
    <div class="name">김민지</div>
    <div class="title">코트의 지휘자</div>
    <div class="stats"><div class="stat">공격<span class="score">8.4</span></div><div class="stat">수비<span class="score">7.9</span></div><div class="stat">토스<span class="score">9.2</span></div><div class="stat">서브<span class="score">8.0</span></div></div>
  </div>
  <div class="card legend">
    <div class="top"><span class="lvl">LV.21</span><span class="rarity">★ LEGENDARY</span></div>
    <div class="avatar">홍</div>
    <div class="name">홍길동</div>
    <div class="title">네트 위의 암살자</div>
    <div class="stats"><div class="stat">공격<span class="score">9.6</span></div><div class="stat">수비<span class="score">8.8</span></div><div class="stat">토스<span class="score">9.0</span></div><div class="stat">서브<span class="score">9.4</span></div></div>
  </div>
</body></html>
