<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body{margin:0;padding:24px;background:var(--pc-surface);font-family:var(--pc-font-sans);}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
.lbl{font-size:10px;color:var(--pc-ink-tertiary);font-weight:600;letter-spacing:.06em;text-transform:uppercase;width:74px;font-family:var(--pc-font-mono);}
.btn{font-family:var(--pc-font-sans);font-weight:700;border:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;border-radius:14px;padding:12px 18px;font-size:14px;letter-spacing:-0.01em;transition:all 200ms cubic-bezier(0.34,1.56,0.64,1);}
.primary{background:var(--pc-primary);color:#fff;box-shadow:0 2px 0 var(--pc-primary-press);}
.secondary{background:var(--pc-ink);color:#fff;}
.ghost{background:transparent;color:var(--pc-ink);border:1.5px solid var(--pc-border-strong);}
.gold{background:linear-gradient(135deg,#FFD24A,#FF8C42);color:#4A2F00;box-shadow:var(--pc-shadow-glow-gold);}
.sm{padding:8px 12px;font-size:12px;border-radius:10px;}
.lg{padding:16px 22px;font-size:16px;border-radius:16px;}
.disabled{opacity:.4;cursor:not-allowed;}
</style></head>
<body>
  <div class="row"><span class="lbl">Primary</span>
    <button class="btn primary">평가하기</button>
    <button class="btn primary sm">저장</button>
    <button class="btn primary lg">+ 경기 만들기</button>
    <button class="btn primary disabled">제출</button>
  </div>
  <div class="row"><span class="lbl">Secondary</span>
    <button class="btn secondary">팀 짜기</button>
    <button class="btn ghost">취소</button>
    <button class="btn ghost sm">필터</button>
  </div>
  <div class="row"><span class="lbl">Special</span>
    <button class="btn gold">🏆 MVP 보기</button>
    <button class="btn primary" style="border-radius:9999px;">+12 EXP</button>
  </div>
</body></html>
